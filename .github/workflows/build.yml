name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper jar is not committed, so Gradle itself is pinned here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      # Debug builds are signed with the auto-generated debug keystore, so this
      # artifact is directly sideloadable from the workflow run page.
      - uses: actions/upload-artifact@v5
        with:
          name: floating-dpad-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
