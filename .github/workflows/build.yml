name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Runners are fresh VMs with no ~/.android/debug.keystore, so AGP would mint a
      # random one per run and every build would be signed by a different key. Android
      # then refuses to update an installed app and reports only "App not installed".
      - name: Restore the shared debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 is not set. Without it this build would be signed with a throwaway key and could not be installed over an existing copy."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      # The wrapper jar is not committed, so Gradle itself is pinned here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      # Debug builds are signed with the auto-generated debug keystore, so this
      # artifact is directly sideloadable from the workflow run page.
      - uses: actions/upload-artifact@v5
        with:
          name: floating-dpad-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
