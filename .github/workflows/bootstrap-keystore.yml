name: bootstrap-keystore

# One-time, manual only. Generates the debug keystore that every build must share, so
# that updates install over the top instead of tripping Android's signature check.
# The output is captured into the DEBUG_KEYSTORE_B64 secret and this workflow is then
# deleted -- it exists for a single run.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # These exact values are what AGP's default debug signing config looks for, so
      # nothing in build.gradle.kts has to change.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - uses: actions/upload-artifact@v5
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 1
          if-no-files-found: error
